name: Publish v15 storefront
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy v15 file to index.html
        run: |
          test -f the-book-porch-2.html
          cp the-book-porch-2.html index.html
          rm the-book-porch-2.html
          git config user.name "bonds12"
          git config user.email "bonds12@users.noreply.github.com"
          git add -A
          git commit -m "Publish v15: 52 books — series grouping, Energy, Gas Gods #4, Midnight #3"
          git push
