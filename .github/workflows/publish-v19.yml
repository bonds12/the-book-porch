name: Publish v19

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-v19.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy v19 storefront to index.html
        run: cp the-book-porch-2.html index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish v19 (68 books)" || echo "No changes to commit"
          git push
