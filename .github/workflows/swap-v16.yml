name: Swap storefront v16 into place
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy staged storefront to index.html
        run: |
          cp the-book-porch-2.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish storefront v16 (54 books): swap the-book-porch-2.html into index.html"
          git push
