name: Publish v17 storefront
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy staged v17 file into place as index.html
        run: cp the-book-porch-2.html index.html
      - name: Commit index.html
        run: |
          git config user.name "bonds12"
          git config user.email "bonds12@users.noreply.github.com"
          git add index.html
          git commit -m "Publish storefront v17 (54 books): swap the-book-porch-2.html into index.html" || echo "nothing to commit"
          git push
